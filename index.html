  function loadList() {
    var def = listDef();
    $('#wp-list-body').html('<div class="wp-loading">Loading...</div>');
    post('list_get', { list_name: def.key }, function (r) {
      if (!r.status) { $('#wp-list-body').html('<div class="wp-empty">' + esc(r.msg || 'error') + '</div>'); return; }
      // backend returns {value,type,remark,index}; the table renders x.display
      S.listRows = (r.data || []).map(function (x) {
        return { display: x.value != null ? x.value : (x.ip || ''), type: x.type,
                 remark: x.remark, index: x.index };
      });
      S.listPage = S.listPage || 1; S.listSize = S.listSize || 10;

      /* ---- add form ---- */
      var h = '<div class="wp-form-t">' + def.head + '</div>';
      if (def.kind === 'ip') {
        h += formRow('Type', '<div class="wp-seg" id="wp-ip-type"><span class="on" data-v="ipv4">IPv4</span>' +
          '<span data-v="ipv6" title="The WAF engine only supports IPv4 addresses">IPv6</span></div>' +
          '<span id="wp-ip6-note" style="display:none;color:var(--wp-orange);font-size:12px;margin-left:10px">' +
          'The engine stores IPv4 only — IPv6 entries cannot be added.</span>');
        h += formRow('Start IP', '<input class="wp-in wp-f" id="wp-l-start" placeholder="Please enter start IP address, e.g.: 192.168.1.1">');
        h += formRow('End IP', '<input class="wp-in wp-f" id="wp-l-end" placeholder="Please enter end IP address, e.g.: 192.168.1.24">');
      } else {
        h += formRow(def.kind === 'ua' ? 'User-Agent' : 'URL',
          '<input class="wp-in wp-f" id="wp-l-start" placeholder="' + (def.ph || '') + '">');
      }
      h += formRow('Remarks', '<input class="wp-in wp-f" id="wp-l-remark" placeholder="Please enter remarks">');
      h += formRow('', '<span class="wp-btn primary" id="wp-list-add">Add</span>');

      /* ---- toolbar ---- */
      h += '<div class="wp-list-bar">' +
        '<span class="wp-btn" id="wp-l-import">Import</span>' +
        '<span class="wp-btn" id="wp-l-export">Export</span>' +
        (def.kind === 'ua' ? '' : '<span class="wp-btn" id="wp-l-empty">Empty</span>') +
        '<div class="wp-search" style="margin-left:auto">' +
        '<input class="wp-in" id="wp-l-q" placeholder="Please enter IP/remarks" value="' + esc(S.listQ || '') + '">' +
        '<span class="wp-search-i">&#9906;</span></div></div>';
      h += '<div id="wp-list-table"></div>';

      /* ---- notes ---- */
      h += '<ul class="wp-notes">' + def.notes.map(function (n) { return '<li>' + n + '</li>'; }).join('') + '</ul>';
      $('#wp-list-body').html(h);
      renderListTable();

      $('#wp-ip-type span').on('click', function () {
        $('#wp-ip-type span').removeClass('on'); $(this).addClass('on');
        $('#wp-ip6-note').toggle($(this).data('v') === 'ipv6');
      });
      function add() {
        if ($('#wp-ip-type .on').data('v') === 'ipv6') {
          layer.msg('The WAF engine supports IPv4 only', { icon: 2 }); return;
        }
        var v = ($('#wp-l-start').val() || '').trim();
        if (!v) { layer.msg('Enter a value', { icon: 0 }); return; }
        var d = { list_name: def.key, value: v, remark: ($('#wp-l-remark').val() || '').trim() };
        if (def.kind === 'ip') { d.start_ip = v; d.end_ip = ($('#wp-l-end').val() || '').trim(); }
        post('list_add', d, function (rr) {
          layer.msg((rr && rr.msg) || 'No response', { icon: (rr && rr.status) ? 1 : 2 });
          if (rr && rr.status) loadList();
        });
      }
      $('#wp-list-add').on('click', add);
      $('#wp-l-start,#wp-l-end,#wp-l-remark').on('keydown', function (e) { if (e.keyCode === 13) add(); });
      $('#wp-l-q').on('input', function () { S.listQ = $(this).val() || ''; S.listPage = 1; renderListTable(); });

      $('#wp-l-export').on('click', function () {
        post('list_export', { list_name: def.key }, function (rr) {
          if (!rr.status) { layer.msg(rr.msg || 'Export failed', { icon: 2 }); return; }
          layer.msg(rr.rows + ' rows exported', { icon: 1 });
          window.open(API + 'download_export&filename=' + encodeURIComponent(rr.filename));
        });
      });
      $('#wp-l-import').on('click', function () {
        layer.open({
          type: 1, title: 'Import to ' + def.t, area: ['560px', '400px'],
          content: '<div class="wp-modal" style="padding:18px 22px">' +
            '<div style="color:#5c6470;font-size:12px;line-height:1.7;margin-bottom:10px">' +
            'One entry per line. Optional remark after a comma.<br>' +
            (def.kind === 'ip' ? 'Examples: <code>192.168.1.5</code> · <code>10.0.0.1-10.0.0.9</code> · <code>192.168.1.0/24,office</code>'
                               : 'Example: <code>/api/callback,payment hook</code>') + '</div>' +
            '<textarea class="wp-in" id="wp-imp-body" style="width:100%;height:190px;font-family:ui-monospace,Menlo,monospace;font-size:12px"></textarea>' +
            '<div style="text-align:right;margin-top:12px"><span class="wp-btn primary" id="wp-imp-go">Import</span></div></div>',
          success: function () {
            $('#wp-imp-go').on('click', function () {
              post('list_import', { list_name: def.key, body: $('#wp-imp-body').val() || '' }, function (rr) {
                layer.msg((rr && rr.msg) || 'No response', { icon: (rr && rr.status) ? 1 : 2, time: 4000 });
                layer.closeAll('page'); loadList();
              });
            });
          }
        });
      });
      $('#wp-l-empty').on('click', function () {
        layer.confirm('Remove every entry from <b>' + def.t + '</b>?<br>This cannot be undone.',
          { icon: 3, title: 'Empty list' }, function (i) {
            layer.close(i);
            post('list_empty', { list_name: def.key }, function (rr) {
              layer.msg((rr && rr.msg) || 'No response', { icon: (rr && rr.status) ? 1 : 2 });
              loadList();
            });
          });
      });
    });
  }

  function renderListTable() {
    var def = listDef();
    var q = (S.listQ || '').toLowerCase();
    var all = (S.listRows || []).filter(function (x) {
      return !q || (x.display + ' ' + (x.remark || '')).toLowerCase().indexOf(q) !== -1;
    });
    var pages = Math.max(Math.ceil(all.length / S.listSize), 1);
    if (S.listPage > pages) S.listPage = pages;
    var rows = all.slice((S.listPage - 1) * S.listSize, S.listPage * S.listSize);
    var col1 = def.kind === 'ip' ? 'Start IP - End IP' : (def.kind === 'ua' ? 'User-Agent rule' : 'URL rule');

    var h = '<table class="wp-tbl"><thead><tr><th>' + col1 + '</th>' +
      '<th style="width:90px">Type</th><th style="width:220px">Remarks</th>' +
      '<th style="width:90px">Operate</th></tr></thead><tbody>';
    h += rows.length ? rows.map(function (v) {
      return '<tr><td style="color:var(--wp-text);' +
        (def.kind === 'ua' ? 'font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all' : '') + '">' +
        esc(v.display) + '</td>' +
        '<td>' + esc(v.type || (def.kind === 'ip' ? 'IPv4' : 'URL')) + '</td>' +
        '<td class="ell">' + (v.remark ? esc(v.remark) : '<span style="color:var(--wp-text3)">--</span>') + '</td>' +
        '<td><span class="wp-lnk wp-list-del" data-i="' + v.index + '">Delete</span></td></tr>';
    }).join('') : '<tr><td colspan="4" class="wp-empty">' +
      (S.listRows.length ? 'Nothing matches "' + esc(S.listQ) + '"' : 'List is empty') + '</td></tr>';
    h += '</tbody></table>';
    h += pager(S.listPage, pages, all.length, 'wp-l-pg');
    $('#wp-list-table').html(h);

    bindPager('wp-l-pg', pages, function (p) { S.listPage = p; renderListTable(); });
    $('.wp-list-del').on('click', function () {
      var idx = $(this).data('i');
      layer.confirm('Delete this entry?', { icon: 3, title: 'Delete' }, function (i) {
        layer.close(i);
        post('list_del', { list_name: listDef().key, index: idx }, function (rr) {
          layer.msg((rr && rr.msg) || 'No response', { icon: (rr && rr.status) ? 1 : 2 });
          loadList();
        });
      });
    });
  }
  function formRow(label, ctrl) {
    return '<div class="wp-form-row"><div class="wp-form-lbl">' + label + '</div>' +
      '<div class="wp-form-ctl">' + ctrl + '</div></div>';
  }

  /* ================= CUSTOM RULES ================= */
  /* ================= CUSTOM RULES =================
     User-defined multi-condition rules. Each rule is a set of AND-conditions;
     if all match, the action fires. Evaluated before the built-in filters, so
     an allow rule whitelists and a block rule pre-empts them. */
  var CR_FIELDS = [
    { v: 'ip', t: 'IP range', kind: 'ipset' },
    { v: 'country', t: 'Country', kind: 'country' },
    { v: 'method', t: 'Method', kind: 'text' },
    { v: 'uri', t: 'URI (path)', kind: 'text' },
    { v: 'uri_args', t: 'URI (with parameters)', kind: 'text' },
    { v: 'uri_param', t: 'URI parameter', kind: 'named' },
    { v: 'args', t: 'Query string', kind: 'text' },
    { v: 'user_agent', t: 'User-Agent', kind: 'text' },
    { v: 'referer', t: 'Referer', kind: 'text' },
    { v: 'cookie', t: 'Cookie', kind: 'text' },
    { v: 'header', t: 'Request header', kind: 'named' }
  ];
  var CR_TEXT_OPS = [
    { v: 'eq', t: 'equals' }, { v: 'ne', t: 'does not equal' },
    { v: 'contains', t: 'contains' }, { v: 'ncontains', t: 'does not contain' },
    { v: 'prefix', t: 'starts with' }, { v: 'suffix', t: 'ends with' },
    { v: 'regex', t: 'matches regex' }, { v: 'in', t: 'is one of (comma list)' },
    { v: 'exists', t: 'exists' }, { v: 'nexists', t: 'is absent' }
  ];
  var CR_SET_OPS = [{ v: 'match', t: 'is in' }, { v: 'notmatch', t: 'is not in' }];
  var CR_STATUS = [
    { code: 403, name: '403 Access denied' }, { code: 444, name: '444 Close connection' },
    { code: 404, name: '404 Not found' }, { code: 502, name: '502 Bad gateway' },
    { code: 503, name: '503 Service unavailable' }
  ];
  function crFieldOf(v) { return CR_FIELDS.filter(function (x) { return x.v === v; })[0] || CR_FIELDS[0]; }
  function crFieldName(v) { return crFieldOf(v).t; }
  function crRuleSummary(r) {
    // the paid UI lists the fields a rule matches on
    var seen = {}, out = [];
    (r.conds || []).forEach(function (c) { if (!seen[c.field]) { seen[c.field] = 1; out.push(crFieldName(c.field)); } });
    return out.join(', ');
  }
  function crActionText(r) {
    if (r.action === 'allow') return 'Allow (whitelist)';
    if (r.action === 'block') return 'Intercept (default blocked page)';
    return 'Intercept (' + r.status + ' response)';
  }

  function pageRules() {
    $('#wp-body').html('<div class="wp-loading">Loading...</div>');
    post('custom_rules', {}, function (r) {
      if (!r.status) { $('#wp-body').html('<div class="wp-note">' + esc(r.msg || 'error') + '</div>'); return; }
      S.crMeta = r;
      renderCustom(r);
    });
  }

  function renderCustom(r) {
    var e = r.engine || {};
    var h = '';
    if (!e.wired) {
      h += '<div class="wp-note" style="margin-bottom:12px">' + icoWarn() +
        ' The engine is not wired into nginx, so these rules are stored but not enforced.</div>';
    }
    h += '<div class="wp-card">';
    h += '<div style="margin-bottom:14px"><span class="wp-btn primary" id="cr-add">Add custom interception</span></div>';
    h += '<table class="wp-tbl"><thead><tr>' +
      '<th style="width:140px">Rule name</th>' +
      '<th style="width:160px">Website name</th>' +
      '<th style="width:90px">Status</th>' +
      '<th style="width:60px">Hits</th>' +
      '<th>Rule</th>' +
      '<th style="width:230px">Action</th>' +
      '<th style="width:140px">Operate</th></tr></thead><tbody>';
    if (!r.rules.length) {
      h += '<tr><td colspan="7" style="padding:26px;text-align:center;color:var(--wp-text3)">No custom rule yet.</td></tr>';
    } else {
      h += r.rules.map(function (x) {
        return '<tr data-id="' + x.id + '">' +
          '<td style="color:var(--wp-text);font-weight:600">' + esc(x.name) + '</td>' +
          '<td class="ell" title="' + esc(x.site) + '">' + esc(x.site) + '</td>' +
          '<td><span class="cr-st" style="cursor:pointer;color:' + (x.open ? 'var(--wp-green)' : 'var(--wp-text3)') + '">' +
            (x.open ? 'Running &#9654;' : 'Stopped &#9632;') + '</span></td>' +
          '<td style="color:' + (x.hits ? 'var(--wp-red)' : 'var(--wp-text3)') + ';font-weight:600">' + num(x.hits) + '</td>' +
          '<td style="color:var(--wp-text2)">' + esc(crRuleSummary(x)) + '</td>' +
          '<td>' + esc(crActionText(x)) + '</td>' +
          '<td>' +
            '<a href="javascript:;" class="cr-copy" style="color:var(--wp-green)">Copy</a> <span style="color:var(--wp-border)">|</span> ' +
            '<a href="javascript:;" class="cr-edit" style="color:var(--wp-green)">Edit</a> <span style="color:var(--wp-border)">|</span> ' +
            '<a href="javascript:;" class="cr-del" style="color:var(--wp-green)">Delete</a></td></tr>';
      }).join('');
    }
    h += '</tbody></table>';
    h += '<ul class="wp-notes">' +
      '<li>Custom rules run before the built-in filters: an <b>allow</b> rule whitelists the request, a <b>block</b> rule stops it early.</li>' +
      '<li>All conditions in a rule must match (AND). Loopback and LAN traffic is never touched.</li>' +
      '</ul>';
    h += '</div>';
    $('#wp-body').html(h);

    $('#cr-add').on('click', function () { crDialog(null); });
    $('#wp-body').on('click', '.cr-edit', function () {
      var id = $(this).closest('tr').data('id');
      crDialog(r.rules.filter(function (x) { return x.id === id; })[0]);
    });
    $('#wp-body').on('click', '.cr-copy', function () {
      var id = $(this).closest('tr').data('id');
      post('custom_copy', { id: id }, function (rr) {
        layer.msg(rr.msg, { icon: rr.status ? 1 : 2 });
        if (rr.status) route();
      });
    });
    $('#wp-body').on('click', '.cr-st', function () {
      var tr = $(this).closest('tr'), id = tr.data('id');
      var rule = r.rules.filter(function (x) { return x.id === id; })[0];
      post('custom_toggle', { id: id, open: rule.open ? 0 : 1 }, function (rr) {
        layer.msg(rr.msg, { icon: rr.status ? 1 : 2 });
        if (rr.status) route();
      });
    });
    $('#wp-body').on('click', '.cr-del', function () {
      var id = $(this).closest('tr').data('id');
      layer.confirm('Delete this custom rule?', function (i) {
        layer.close(i);
        post('custom_del', { id: id }, function (rr) {
          layer.msg(rr.msg, { icon: rr.status ? 1 : 2 });
          if (rr.status) route();
        });
      });
    });
  }

  // one condition row inside the dialog
  function crCondRow(c) {
    c = c || { field: 'uri', op: 'contains', extra: '', value: '' };
    var fopts = CR_FIELDS.map(function (f) {
      return '<option value="' + f.v + '"' + (f.v === c.field ? ' selected' : '') + '>' + f.t + '</option>';
    }).join('');
    return '<div class="cr-cond" style="display:flex;gap:6px;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap">' +
      '<select class="wp-in cr-c-field" style="width:150px">' + fopts + '</select>' +
      '<input class="wp-in cr-c-extra" placeholder="name" style="width:110px" value="' + esc(c.extra || '') + '">' +
      '<select class="wp-in cr-c-op" style="width:150px"></select>' +
      '<input class="wp-in cr-c-value" placeholder="value" style="flex:1;min-width:140px" value="' + esc(c.value || '') + '">' +
      '<span class="wp-btn cr-c-del" style="padding:6px 10px">&times;</span></div>';
  }
  // sync a condition row's op list + which inputs show, from its field
  function crSyncRow($row, presetOp) {
    var f = crFieldOf($row.find('.cr-c-field').val());
    var ops = (f.kind === 'ipset' || f.kind === 'country') ? CR_SET_OPS : CR_TEXT_OPS;
    $row.find('.cr-c-op').html(ops.map(function (o) {
      return '<option value="' + o.v + '"' + (o.v === presetOp ? ' selected' : '') + '>' + o.t + '</option>';
    }).join(''));
    $row.find('.cr-c-extra').css('display', f.kind === 'named' ? '' : 'none')
      .attr('placeholder', f.v === 'header' ? 'header name' : 'param name');
    var op = $row.find('.cr-c-op').val();
    var noVal = (op === 'exists' || op === 'nexists');
    $row.find('.cr-c-value').css('display', noVal ? 'none' : '')
      .attr('placeholder', (f.kind === 'ipset') ? '1.2.3.0/24, 5.5.5.5'
        : (f.kind === 'country') ? 'TR, US, DE' : 'value');
  }

  function crDialog(rule) {
    var r = S.crMeta, edit = !!rule;
    rule = rule || { name: '', site: '', action: 'block', status: 403,
                     conds: [{ field: 'uri', op: 'contains', extra: '', value: '' }] };
    var sites = (r.sites || []).map(function (s) {
      return '<option value="' + esc(s) + '"' + (s === rule.site ? ' selected' : '') + '>' + esc(s) + '</option>';
    }).join('');
    var codes = CR_STATUS.map(function (s) {
      return '<option value="' + s.code + '"' + (s.code === rule.status ? ' selected' : '') + '>' + s.name + '</option>';
    }).join('');

    var h = '<div class="wp-modal">' +
      '<div class="wp-mod-head">' +
        '<div class="wp-mod-site">' + (edit ? 'Edit' : 'Add') + ' custom interception</div>' +
        '<div class="wp-mod-meta">All conditions must match for the action to fire.</div>' +
      '</div>' +
      '<div class="wp-mod-body">' +
        '<div class="wp-mod-sec"><div class="wp-mod-sec-t">Rule</div>' +
          '<div class="wp-mod-row"><div class="wp-mod-lbl">Rule name</div>' +
            '<div class="wp-mod-ctl"><input class="wp-in" id="cr-name" style="min-width:250px" value="' + esc(rule.name) + '" placeholder="e.g. block_admin"></div>' +
            '<div class="wp-mod-hint"></div></div>' +
          '<div class="wp-mod-row"><div class="wp-mod-lbl">Website</div>' +
            '<div class="wp-mod-ctl"><select class="wp-in" id="cr-site" style="min-width:250px">' + sites + '</select></div>' +
            '<div class="wp-mod-hint"></div></div>' +
        '</div>' +
        '<div class="wp-mod-sec"><div class="wp-mod-sec-t">Conditions <span style="text-transform:none;font-weight:400;color:var(--wp-text3)">(all must match)</span></div>' +
          '<div id="cr-conds"></div>' +
          '<span class="wp-btn" id="cr-add-cond" style="margin-top:4px">+ Add condition</span>' +
        '</div>' +
        '<div class="wp-mod-sec"><div class="wp-mod-sec-t">Action</div>' +
          '<div class="wp-mod-row"><div class="wp-mod-lbl">When matched</div>' +
            '<div class="wp-mod-ctl"><select class="wp-in" id="cr-action" style="min-width:250px">' +
              '<option value="block"' + (rule.action === 'block' ? ' selected' : '') + '>Intercept — default blocked page</option>' +
              '<option value="code"' + (rule.action === 'code' ? ' selected' : '') + '>Intercept — custom status code</option>' +
              '<option value="allow"' + (rule.action === 'allow' ? ' selected' : '') + '>Allow — whitelist, skip all checks</option>' +
            '</select></div>' +
            '<div class="wp-mod-hint"></div></div>' +
          '<div class="wp-mod-row" id="cr-code-row"><div class="wp-mod-lbl">Status code</div>' +
            '<div class="wp-mod-ctl"><select class="wp-in" id="cr-code" style="min-width:250px">' + codes + '</select></div>' +
            '<div class="wp-mod-hint"></div></div>' +
        '</div>' +
      '</div>' +
      '<div class="wp-mod-foot">' +
        '<span class="wp-btn" id="cr-cancel">Cancel</span>' +
        '<span class="wp-btn primary" id="cr-ok">' + (edit ? 'Save' : 'Add') + '</span>' +
      '</div></div>';

    var idx = layer.open({ type: 1, title: false, closeBtn: 1, area: ['760px', '640px'], content: h });

    function addCond(c) {
      var $row = $(crCondRow(c)).appendTo('#cr-conds');
      crSyncRow($row, c && c.op);
    }
    (rule.conds || []).forEach(addCond);
    $('#cr-add-cond').on('click', function () { addCond(null); });
    $('#cr-conds').on('change', '.cr-c-field', function () { crSyncRow($(this).closest('.cr-cond')); });
    $('#cr-conds').on('change', '.cr-c-op', function () { crSyncRow($(this).closest('.cr-cond'), $(this).val()); });
    $('#cr-conds').on('click', '.cr-c-del', function () {
      if ($('.cr-cond').length > 1) $(this).closest('.cr-cond').remove();
      else layer.msg('A rule needs at least one condition', { icon: 0 });
    });

    function syncCode() { $('#cr-code-row').css('display', $('#cr-action').val() === 'code' ? '' : 'none'); }
    syncCode();
    $('#cr-action').on('change', syncCode);
    $('#cr-cancel').on('click', function () { layer.close(idx); });
    $('#cr-ok').on('click', function () {
      var conds = [];
      $('.cr-cond').each(function () {
        var $r = $(this);
        conds.push({ field: $r.find('.cr-c-field').val(), op: $r.find('.cr-c-op').val(),
                     extra: $r.find('.cr-c-extra').val(), value: $r.find('.cr-c-value').val() });
      });
      var payload = { name: $('#cr-name').val(), site: $('#cr-site').val(),
                      action: $('#cr-action').val(), status_code: $('#cr-code').val(),
                      conds: JSON.stringify(conds) };
      if (edit) payload.id = rule.id;
      post(edit ? 'custom_edit' : 'custom_add', payload, function (rr) {
        layer.msg(rr.msg, { icon: rr.status ? 1 : 2 });
        if (rr.status) { layer.close(idx); route(); }
      });
    });
  }

  /* ================= OVERVIEW ================= */
  function pageOverview() {
    $('#wp-body').html('<div class="wp-loading">Loading dashboard...</div>');
    post('overview', {}, function (d) {
      if (d.engine_installed === false) {
        $('#wp-body').html('<div class="wp-note">The <b>Nginx free firewall</b> engine is not installed. ' +
          'WAF Pro Panel is the management UI for that engine — install it from the App Store first.</div>');
        return;
      }
      if (!d.status) { $('#wp-body').html('<div class="wp-note">' + esc(d.msg || 'Failed to load') + '</div>'); return; }
      var c = d.cards || {};
      var h = '';

      /* ---- Pro layout: narrow left column, wide right column ---- */
      h += '<div class="wp-row wp-main-grid">';

      // ---- LEFT column ----
      h += '<div class="wp-col">';
      h += '<div class="wp-daterow">' +
        '<div class="wp-seg"><span class="' + (S.range === 'yesterday' ? 'on' : '') + '" data-r="yesterday">Yesterday</span>' +
        '<span class="' + (S.range === 'today' ? 'on' : '') + '" data-r="today">Today</span></div>' +
        '<span class="wp-count" title="Blocked today">' + num(c.malicious_request) + '</span>' +
        '<span class="wp-btn wp-ref" id="wp-refresh" title="Refresh">&#8635;</span></div>';
      h += '<div class="wp-stat-2">' +
        statCard('Today request', c.today_request, c.today_request_pct, 'Yesterday: ' + num(c.yesterday_request), false) +
        statCard('Malicious request', c.malicious_request, c.malicious_request_pct, 'Yesterday: ' + num(c.yesterday_malicious), true) +
        '</div>';
      h += '<div class="wp-card"><div class="wp-card-h">' + icoPulse() +
        '<span class="t" id="wp-qps-t">Real-time QPS: 0/s</span></div>' +
        '<div class="wp-chart sm" id="wp-qps-chart"></div></div>';
      h += '<div class="wp-card"><div class="wp-card-h">' + icoClock() +
        '<span class="t" id="wp-rt-t">Real-time origin response: 0ms</span></div>' +
        '<div id="wp-rt-holder"><div class="wp-chart sm" id="wp-rt-chart"></div></div></div>';
      h += '<div class="wp-card"><div class="wp-card-h">' + icoWarn() +
        '<span class="t">Attacked domains TOP10</span></div>' +
        '<div id="wp-top-domains"></div></div>';
      // what kind of attacks are landing — the engine already counts this per
      // rule, and it is the first thing you want when a number spikes
      h += '<div class="wp-card"><div class="wp-card-h">' + icoPie() +
        '<span class="t">Intercept types</span></div>' +
        '<div id="wp-by-rule"></div></div>';
      h += '</div>';

      // ---- RIGHT column ----
      h += '<div class="wp-col">';
      h += '<div class="wp-card"><div class="wp-card-h">' + icoFilter() +
        '<span class="t">Traffic filtering request chart</span>' +
        '<span class="r"><span class="wp-chip">Unique IP: ' + num(c.today_ips) + '</span>' +
        '<span class="wp-chip">Traffic: ' + mb(c.today_bytes) + '</span></span></div>' +
        '<div class="wp-chart" id="wp-main-chart"></div></div>';
      // map card holds the map AND the attacker table, like the Pro UI
      h += '<div class="wp-card"><div class="wp-card-h">' + icoGlobe() +
        '<span class="t">Access / Block Map</span>' +
        '<span class="r"><span style="color:var(--wp-text3);font-size:12px">(*Only shows TOP coordinates)</span>' +
        '<div class="wp-seg" id="wp-map-mode">' +
        '<span data-m="requests">Requests</span><span class="on" data-m="blocks">Blocks</span></div></span></div>' +
        '<div class="wp-map-wrap">' +
        '<div><div class="wp-chart" style="height:320px" id="wp-map"></div>' +
        '<div class="wp-legend"><span>Low</span><i class="g1"></i><i class="g2"></i><i class="g3"></i><span>High</span></div></div>' +
        '<div class="wp-attack-side"><div class="wp-scroll" style="max-height:352px">' +
        '<table class="wp-tbl"><thead><tr><th>Attack IP</th><th style="width:76px">Times</th>' +
        '<th style="width:118px">IP attribution</th></tr></thead>' +
        '<tbody id="wp-attack-ips"></tbody></table></div></div>' +
        '</div></div>';
      h += '</div>';
      h += '</div>';

      // ---- bottom: remaining TOP10 panels (Attacked domains lives in the left column) ----
      h += '<div class="wp-row" style="grid-template-columns:repeat(2,1fr)">';
      h += '<div class="wp-card"><div class="wp-card-h">' + icoChart() + '<span class="t">Traffic ranking TOP10</span></div>' +
        '<div id="wp-top-traffic"></div></div>';
      h += '<div class="wp-card"><div class="wp-card-h">' + icoDoc() + '<span class="t">Visited pages TOP10</span></div>' +
        '<div id="wp-top-urls"></div></div>';
      h += '</div>';

      // ---- latest intercepts ----
      h += '<div class="wp-row" style="grid-template-columns:1fr">';
      h += '<div class="wp-card"><div class="wp-card-h">' + icoClock() + '<span class="t">Latest intercepts</span></div>' +
        '<div class="wp-scroll" style="max-height:200px"><table class="wp-tbl"><thead><tr>' +
        '<th style="width:150px">Time</th><th style="width:130px">IP</th><th style="width:120px">Country</th>' +
        '<th>URL</th><th style="width:100px">Type</th>' +
        '</tr></thead><tbody id="wp-recent"></tbody></table></div></div>';
      h += '</div>';

      $('#wp-body').html(h);
      fillOverview(d);

      $('#wp-refresh').on('click', pageOverview);
      $('.wp-seg span').on('click', function () {
        S.range = $(this).data('r');
        $('.wp-seg span').removeClass('on'); $(this).addClass('on');
        drawMainChart(d);
      });

      $('#wp-map-mode span').on('click', function () {
        $('#wp-map-mode span').removeClass('on');
        $(this).addClass('on');
        S.mapMode = $(this).data('m');
        drawMap(d);
      });

      // default to whichever map mode actually has points to show
      if (!S.mapMode) {
        S.mapMode = (d.attack_map && d.attack_map.length) ? 'blocks' : 'requests';
        $('#wp-map-mode span').removeClass('on')
          .filter('[data-m="' + S.mapMode + '"]').addClass('on');
      }

      ensureEcharts(function () {
        drawMainChart(d);
        loadWorld(function () { drawMap(d); });
        startQps();
      });
    });
  }

  /* ---------- world map ---------- */
  function loadWorld(cb) {
    if (typeof echarts === 'undefined') return cb();
    if (echarts.getMap && echarts.getMap('world')) return cb();
    // the panel already ships the world geojson — no external CDN needed
    $.getJSON('/static/vite/data/world.json').done(function (geo) {
      try { echarts.registerMap('world', geo); } catch (e) {}
      cb();
    }).fail(function () { cb(); });
  }

  function drawMap(d) {
    var mode = S.mapMode || 'blocks';
    var pts = (mode === 'blocks' ? d.attack_map : d.request_map) || [];
    var countries = (mode === 'blocks' ? d.by_country : d.request_countries) || [];
    rankCountries(countries);

    var el = document.getElementById('wp-map');
    if (!el) return;
    if (typeof echarts === 'undefined' || !echarts.getMap || !echarts.getMap('world')) {
      el.innerHTML = '<div class="wp-empty">World map data unavailable</div>';
      return;
    }
    if (!pts.length) {
      el.innerHTML = '<div class="wp-empty">No ' + (mode === 'blocks' ? 'blocked' : 'request') + ' locations today</div>';
      return;
    }
    var max = Math.max.apply(null, pts.map(function (p) { return p.count; })) || 1;
    var color = mode === 'blocks' ? '#ef4d4d' : '#20a53a';
    ec('wp-map', {
      tooltip: {
        trigger: 'item',
        formatter: function (p) {
          if (!p.data || !p.data.meta) return p.name || '';
          var m = p.data.meta;
          return (m.country || 'Unknown') + (m.city ? ' / ' + m.city : '') +
            '<br/>' + (mode === 'blocks' ? 'Blocks: ' : 'Requests: ') + m.count;
        }
      },
      geo: {
        map: 'world', roam: true, zoom: 1.2, center: [10, 20],
        itemStyle: { areaColor: '#eef1f3', borderColor: '#dfe4e8' },
        emphasis: { itemStyle: { areaColor: '#e3ece5' }, label: { show: false } }
      },
      series: [{
        type: 'effectScatter', coordinateSystem: 'geo', zlevel: 2,
        rippleEffect: { brushType: 'stroke', scale: 2.5 },
        symbolSize: function (v) { return Math.max(6, Math.min(26, 6 + (v[2] / max) * 20)); },
        itemStyle: { color: color },
        data: pts.map(function (p) {
          return { name: p.country || '', value: [p.lon, p.lat, p.count], meta: p };
        })
      }]
    });
  }

  function rankCountries(list) {
    // the country panel only exists in some layouts — skip quietly if absent
    if (!$('#wp-country-rank').length) return;
    if (!list.length) { $('#wp-country-rank').html('<div class="wp-empty">No data</div>'); return; }
    var max = Math.max.apply(null, list.map(function (x) { return x.count; })) || 1;
    $('#wp-country-rank').html(list.slice(0, 15).map(function (x, i) {
      return '<div class="wp-rank"><span class="n' + (i < 3 ? ' top' : '') + '">' + (i + 1) + '</span>' +
        '<span class="nm" style="flex:0 0 46px">' + esc(x.code || '??') + '</span>' +
        '<span class="tr"><i style="width:' + Math.max(x.count / max * 100, 2) + '%"></i></span>' +
        '<span class="v">' + num(x.count) + '</span></div>';
    }).join(''));
  }

  function statCard(label, val, pct, sub, isRed) {
    var cls = (pct > 0) ? 'up' : 'down';
    var arrow = (pct > 0) ? '&#8593;' : '&#8595;';
    return '<div class="wp-stat">' +
      '<div class="lbl"><span class="bar' + (isRed ? ' red' : '') + '"></span>' + label + '</div>' +
      '<div class="val" style="color:' + (isRed ? 'var(--wp-red)' : 'var(--wp-text)') + '">' + num(val) + '</div>' +
      '<div class="pct ' + cls + '">' + arrow + ' ' + Math.abs(pct || 0) + '%</div>' +
      '<div class="sub">' + sub + '</div>' +
      (isRed ? svgShieldBg() : svgBugBg()) + '</div>';
  }

  function fillOverview(d) {
    // attack IPs
    var ips = d.top_attack_ips || [];
    var recent = d.recent_attacks || [];
    var lastBy = {};
    recent.forEach(function (r) { if (!lastBy[r.ip]) lastBy[r.ip] = r; });
    $('#wp-attack-ips').html(ips.length ? ips.map(function (x) {
      var attr = x.country ? (x.country + (x.city ? ' / ' + x.city : '')) : 'Unknown';
      return '<tr><td class="ell" style="color:var(--wp-text);font-weight:600" title="' + esc(x.ip) + '">' + esc(x.ip) + '</td>' +
        '<td style="color:var(--wp-red);font-weight:600">' + x.count + '</td>' +
        '<td class="ell" title="' + esc(attr) + '">' + esc(attr) + '</td></tr>';
    }).join('') : '<tr><td colspan="3" class="wp-empty">No attacks recorded today</td></tr>');

    rank('#wp-top-domains', (d.attacked_domains || []).map(function (x) {
      return { name: x.domain, value: x.count };
    }), '');
    renderByRule(d.by_rule || {});
    rank('#wp-top-traffic', (d.top_domains_traffic || []).map(function (x) {
      return { name: x.domain, value: x.bytes, fmt: mb(x.bytes) };
    }), '');
    rank('#wp-top-urls', (d.top_urls || []).map(function (x) {
      return { name: x.url, value: x.count };
    }), '');

    $('#wp-recent').html(recent.length ? recent.slice(0, 20).map(function (r) {
      return '<tr><td>' + esc(r.time) + '</td><td>' + esc(r.ip) + '</td>' +
        '<td class="ell">' + esc(r.country || '-') + '</td>' +
        '<td class="ell" title="' + esc(r.url) + '">' + esc(r.url) + '</td>' +
        '<td><span class="wp-chip ' + esc(r.type) + '">' + esc(r.type) + '</span></td></tr>';
    }).join('') : '<tr><td colspan="5" class="wp-empty">No intercepts today</td></tr>');
  }

  /* The engine logs rule ids ('get', 'upload-ext', 'region:pass'); nobody
     reads those as attack types, so map them to what actually happened. */
  var RULE_LABELS = {
    'get': 'SQL/XSS in query', 'post': 'SQL/XSS in body', 'cookie': 'Cookie attack',
    'user-agent': 'Scanner', 'scan': 'Sensitive path probe', 'cc': 'CC flood',
    'cc-blocked': 'CC flood', 'banned': 'Auto-banned IP', 'ip-black': 'IP blacklist',
    'url-black': 'URL blacklist', 'deny-ext': 'Forbidden file', 'upload-ext': 'Webshell upload',
    'php-path': 'PHP in upload dir', 'method': 'Bad HTTP method', 'header': 'Oversized header',
    'region:intercept': 'Region blocked', 'region:pass': 'Region not allowed'
  };
  function ruleLabel(k) { return RULE_LABELS[k] || k; }

  function renderByRule(by) {
    var items = Object.keys(by).map(function (k) {
      return { name: ruleLabel(k), value: by[k] };
    }).sort(function (a, b) { return b.value - a.value; });
    rank('#wp-by-rule', items, '');
  }

  function rank(sel, items, unit) {
    if (!items.length) { $(sel).html('<div class="wp-empty">No data</div>'); return; }
    var max = Math.max.apply(null, items.map(function (x) { return x.value; })) || 1;
    $(sel).html(items.slice(0, 10).map(function (x, i) {
      return '<div class="wp-rank"><span class="n' + (i < 3 ? ' top' : '') + '">' + (i + 1) + '</span>' +
        '<span class="nm" title="' + esc(x.name) + '">' + esc(x.name) + '</span>' +
        '<span class="tr"><i style="width:' + Math.max(x.value / max * 100, 2) + '%"></i></span>' +
        '<span class="v">' + (x.fmt || num(x.value)) + unit + '</span></div>';
    }).join(''));
  }

  function drawMainChart(d) {
    var ch = d.chart || {};
    ec('wp-main-chart', {
      tooltip: { trigger: 'axis', axisPointer: { type: 'line' } },
      legend: { data: ['Total requests', 'After filtering', 'Blocked', 'IP count'], top: 0, icon: 'circle', itemWidth: 8, textStyle: { fontSize: 11, color: '#5c6470' } },
      grid: { left: 40, right: 16, top: 32, bottom: 24 },
      xAxis: { type: 'category', data: ch.hours || [], boundaryGap: false, axisLine: { lineStyle: { color: '#ebedf0' } }, axisLabel: { color: '#9aa1ab', fontSize: 11 } },
      yAxis: { type: 'value', splitLine: { lineStyle: { color: '#f4f5f6', type: 'dashed' } }, axisLabel: { color: '#9aa1ab', fontSize: 11 } },
      series: [
        { name: 'Total requests', type: 'line', smooth: true, symbol: 'none', data: ch.total || [], lineStyle: { width: 2, color: '#20a53a' }, areaStyle: { color: 'rgba(32,165,58,.08)' } },
        { name: 'After filtering', type: 'line', smooth: true, symbol: 'none', data: ch.after_filter || [], lineStyle: { width: 1.5, color: '#a8b4c0' } },
        { name: 'Blocked', type: 'line', smooth: true, symbol: 'none', data: ch.blocked || [], lineStyle: { width: 2, color: '#ef4d4d' }, areaStyle: { color: 'rgba(239,77,77,.08)' } },
        { name: 'IP count', type: 'line', smooth: true, symbol: 'none', data: ch.ips || [], lineStyle: { width: 1.5, color: '#22c3c3' } }
      ]
    });
  }


  function lineOpt(data, labels, color) {
    return {
      tooltip: { trigger: 'axis' },
      grid: { left: 40, right: 10, top: 10, bottom: 22 },
      xAxis: { type: 'category', data: labels, boundaryGap: false, axisLine: { lineStyle: { color: '#ebedf0' } }, axisLabel: { color: '#9aa1ab', fontSize: 10 } },
      yAxis: { type: 'value', splitLine: { lineStyle: { color: '#f4f5f6', type: 'dashed' } }, axisLabel: { color: '#9aa1ab', fontSize: 10 } },
      series: [{ type: 'line', smooth: true, symbol: 'none', data: data, lineStyle: { width: 2, color: color }, areaStyle: { color: color === '#20a53a' ? 'rgba(32,165,58,.1)' : 'rgba(59,130,246,.1)' } }]
    };
  }
  function startQps() {
    function tick() {
      post('realtime', {}, function (r) {
        if (!r.status || !r.qps) return;
        var q = r.qps;
        var labels = (q.points || []).map(function (x) { return x.t; });
        $('#wp-qps-t').text('Real-time QPS: ' + (q.now || 0) + '/s');
        ec('wp-qps-chart', lineOpt((q.points || []).map(function (x) { return x.v; }), labels, '#20a53a'));

        // origin response: only real data — otherwise offer to switch it on
        if (q.rt_tracked) {
          $('#wp-rt-t').text('Real-time origin response: ' + (q.rt_now || 0) + 'ms');
          if (!$('#wp-rt-chart').length) {
            $('#wp-rt-holder').html('<div class="wp-chart sm" id="wp-rt-chart"></div>');
          }
          ec('wp-rt-chart', lineOpt((q.rt_points || []).map(function (x) { return x.v; }), labels, '#3b82f6'));
        } else {
          $('#wp-rt-t').text('Real-time origin response');
          if (!$('#wp-rt-enable').length) {
            $('#wp-rt-holder').html(
              '<div style="padding:18px 4px;text-align:center">' +
              '<div style="color:var(--wp-text3);font-size:12px;line-height:1.7;margin-bottom:12px">' +
              'Nginx does not log the origin response time by default, so there is no data to chart.<br>' +
              'Enabling adds an <b>upstream_response_time</b> field to your access logs.</div>' +
              '<span class="wp-btn primary" id="wp-rt-enable">Enable tracking</span></div>');
            $('#wp-rt-enable').on('click', function () {
              layer.confirm('Add the origin-response field to your nginx access logs?<br><br>' +
                'This edits nginx.conf and the site configs (both are backed up, nginx is ' +
                'syntax-checked and rolled back automatically if anything fails).',
                { icon: 3, title: 'Enable origin response tracking' }, function (i) {
                  layer.close(i);
                  var ld = layer.msg('Applying...', { icon: 16, time: 0, shade: 0.3 });
                  post('enable_rt', {}, function (rr) {
                    layer.close(ld);
                    layer.msg(rr.msg, { icon: rr.status ? 1 : 2, time: 5000 });
                  });
                });
            });
          }
        }
      });
    }
    tick();
    S.timer = setInterval(tick, 10000);
  }

  /* ================= WEBSITE ================= */
  function pageWebsite() {
    $('#wp-body').html('<div class="wp-loading">Loading...</div>');
    post('get_sites', {}, function (r) {
      S.sites = r.data || [];
      S.malOpen = r.mal_open;
      S.sitePage = 1; S.siteSize = 10; S.siteQ = '';
      var h = '<div class="wp-card">';
      h += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">' +
        '<label style="display:flex;align-items:center;gap:7px;color:var(--wp-text2);cursor:pointer">' +
        '<input type="checkbox" id="wp-mal-all"' + (r.mal_open ? ' checked' : '') + '> ' +
        'Intercept access from known malicious IPs <span class="wp-q" title="Blocks IPs from public abuse feeds (botnets, repeat attackers) across every site. Update the list under Global.">?</span></label>' +
        '<label style="display:flex;align-items:center;gap:7px;color:var(--wp-text2);cursor:pointer">' +
        '<input type="checkbox" id="wp-site-scan-all"> Enable scan protection on all sites</label>' +
        '<div style="margin-left:auto;position:relative">' +
        '<input class="wp-in" id="wp-site-q" placeholder="Please enter site name" style="width:250px;padding-right:30px">' +
        '</div></div>';
      h += '<div id="wp-site-table"></div>';
      h += '<ul style="margin:16px 0 0 18px;color:var(--wp-text3);font-size:12px;line-height:1.9;list-style:disc">' +
        '<li><b>CDN option:</b> after enabling CDN for a website, turn the CDN switch on — otherwise the CDN node IPs get intercepted instead of the real visitors.</li>' +
        '<li><b>Scan protection</b> blocks scanners and crawlers. <b>Block abroad</b> rejects requests from outside your country (configure the country list under Region).</li>' +
        '<li><b>CC defense</b> limits how many requests one IP may send in a cycle; exceeding it blocks the IP for the block time.</li>' +
        '</ul></div>';
      $('#wp-body').html(h);
      renderSiteTable();
      $('#wp-site-q').on('input', function () {
        S.siteQ = ($(this).val() || '').toLowerCase(); S.sitePage = 1; renderSiteTable();
      });
      $('#wp-mal-all').on('change', function () {
        var on = this.checked;
        post('malicious_toggle', { open: on ? 1 : 0 }, function (rr) {
          layer.msg(rr.msg, { icon: rr.status ? 1 : 2 });
          if (!rr.status) $('#wp-mal-all').prop('checked', !on);
        });
      });
      $('#wp-site-scan-all').on('change', function () {
        var on = this.checked ? '1' : '0';
        var names = S.sites.map(function (s) { return s.name; });
        var done = 0;
        if (!names.length) return;
        var ld = layer.msg('Applying...', { icon: 16, time: 0, shade: 0.3 });
        names.forEach(function (n) {
          post('set_site_field', { siteName: n, field: 'scan', value: on }, function () {
            if (++done === names.length) {
              layer.close(ld); layer.msg('Scan protection updated on ' + done + ' site(s)', { icon: 1 });
              pageWebsite();
            }
          });
        });
      });
    });
  }

  function siteFiltered() {
    return S.sites.filter(function (s) {
      return !S.siteQ || s.name.toLowerCase().indexOf(S.siteQ) !== -1;
    });
  }

  function renderSiteTable() {
    var all = siteFiltered();
    var pages = Math.max(Math.ceil(all.length / S.siteSize), 1);
    if (S.sitePage > pages) S.sitePage = pages;
    var rows = all.slice((S.sitePage - 1) * S.siteSize, S.sitePage * S.siteSize);

    var h = '<table class="wp-tbl"><thead><tr>' +
      '<th>Site</th>' +
      '<th style="width:90px">Total interceptions</th>' +
      '<th style="width:90px">Fake spider <span class="wp-q" title="Blocks anything calling itself Googlebot or Bingbot from an IP those crawlers do not publish. Verified crawlers pass untouched.">?</span></th>' +
      '<th style="width:80px">Using CDN <span class="wp-q" title="Read the visitor IP from X-Forwarded-For. Only turn on when a proxy/CDN really sits in front — otherwise visitors can spoof their IP.">?</span></th>' +
      '<th style="width:95px">Smart CC defense <span class="wp-q" title="Tightens each visitor&apos;s CC allowance automatically while the whole site is under load, instead of one fixed limit.">?</span></th>' +
      '<th style="width:110px">Crawl Protection <span class="wp-q" title="Bots that are not verified crawlers get their own tight request budget. Shows the per-minute limit.">?</span></th>' +
      '<th style="width:130px">Waiting Room / Rate Limit <span class="wp-q" title="Past this many requests/second the overflow gets a retry page instead of a timeout.">?</span></th>' +
      '<th style="width:110px">CC Defense</th>' +
      '<th style="width:60px">Status</th>' +
      '<th style="width:100px">Operate</th></tr></thead><tbody>';
    h += rows.length ? rows.map(function (s) {
      return '<tr>' +
        '<td class="ell" style="color:var(--wp-text);font-weight:600" title="' + esc(s.name) + '">' + esc(s.name) + '</td>' +
        '<td style="color:' + (s.intercepts ? 'var(--wp-red)' : 'var(--wp-text3)') + ';font-weight:600">' + num(s.intercepts) + '</td>' +
        '<td>' + cbx(s.name, 'fake_spider', s.fake_spider) + '</td>' +
        '<td>' + cbx(s.name, 'cdn', s.cdn) + '</td>' +
        '<td>' + cbx(s.name, 'smart_cc', s.smart_cc) + '</td>' +
        '<td>' + (s.crawl
          ? '<span style="color:var(--wp-green)">&#10004;</span> <span style="color:var(--wp-text2)">' + num(s.crawl_limit) + '/min</span>'
          : '<span class="wp-dis">Disable</span>') + '</td>' +
        '<td>' + (s.wait
          ? '<span style="color:var(--wp-green)">&#10004;</span> <span style="color:var(--wp-text2)">' + num(s.wait_limit) + '/s</span>'
          : '<span class="wp-dis">Disable</span>') + '</td>' +
        '<td>' + (s.cc_open
          ? '<span style="color:var(--wp-green)">&#10004;</span> <span style="color:var(--wp-text2)">' + num(s.cc_limit) + '/' + s.cc_cycle + 's</span>'
          : '<span class="wp-dis">Disable</span>') + '</td>' +
        '<td><label class="wp-sw"><input type="checkbox" class="wp-site-sw" data-n="' + esc(s.name) + '"' + (s.open ? ' checked' : '') + '><span class="sl"></span></label></td>' +
        '<td><span class="wp-lnk wp-site-log" data-n="' + esc(s.name) + '">Log</span> <span style="color:var(--wp-border)">|</span> ' +
        '<span class="wp-lnk wp-site-mod" data-n="' + esc(s.name) + '">Modify</span></td></tr>';
    }).join('') : '<tr><td colspan="10" class="wp-empty">' +
      (S.sites.length ? 'No site matches "' + esc(S.siteQ) + '"' : 'No sites configured in the WAF engine') + '</td></tr>';
    h += '</tbody></table>';

    // pagination
    h += '<div style="display:flex;align-items:center;gap:8px;margin-top:14px;justify-content:flex-end">' +
      '<span class="wp-btn wp-sp" data-p="prev">&#8249;</span>';
    for (var i = 1; i <= pages; i++) {
      h += '<span class="wp-btn wp-sp' + (i === S.sitePage ? ' primary' : '') + '" data-p="' + i + '" style="min-width:32px;justify-content:center">' + i + '</span>';
    }
    h += '<span class="wp-btn wp-sp" data-p="next">&#8250;</span>' +
      '<select class="wp-in" id="wp-site-size" style="width:100px">' +
      [10, 20, 50].map(function (n) { return '<option value="' + n + '"' + (n === S.siteSize ? ' selected' : '') + '>' + n + ' / page</option>'; }).join('') +
      '</select>' +
      '<span style="color:var(--wp-text2)">Total ' + all.length + '</span></div>';

    $('#wp-site-table').html(h);

    $('.wp-site-sw').on('change', function () {
      var n = $(this).data('n'), on = this.checked ? '1' : '0';
      post('set_site_field', { siteName: n, field: 'open', value: on }, function (rr) {
        layer.msg(rr.msg, { icon: rr.status ? 1 : 2 });
        var s = S.sites.filter(function (x) { return x.name === n; })[0];
        if (s) s.open = on === '1';
      });
    });
    $('.wp-cbx').on('change', function () {
      var n = $(this).data('n'), f = $(this).data('f'), on = this.checked ? '1' : '0';
      post('set_site_field', { siteName: n, field: f, value: on }, function (rr) {
        layer.msg(rr.msg, { icon: rr.status ? 1 : 2 });
        var s = S.sites.filter(function (x) { return x.name === n; })[0];
        if (s) s[f] = on === '1';
      });
    });
    $('.wp-sp').on('click', function () {
      var p = $(this).data('p');
      if (p === 'prev') S.sitePage = Math.max(S.sitePage - 1, 1);
      else if (p === 'next') S.sitePage = Math.min(S.sitePage + 1, pages);
      else S.sitePage = parseInt(p, 10);
      renderSiteTable();
    });
    $('#wp-site-size').on('change', function () {
      S.siteSize = parseInt($(this).val(), 10); S.sitePage = 1; renderSiteTable();
    });
    $('.wp-site-log').on('click', function () {
      // jump to Blockade > Interception record, pre-filtered to this site
      S.blQ = $(this).data('n');
      S.blSub = 'intercept'; S.blDate = 'all';
      S.tab = 'blockade'; renderTabs(); route();
    });
    $('.wp-site-mod').on('click', function () { siteModify($(this).data('n')); });
  }

  function cbx(name, field, on) {
    return '<input type="checkbox" class="wp-cbx" data-n="' + esc(name) + '" data-f="' + field + '"' + (on ? ' checked' : '') + '>';
  }

  function siteModify(name) {
    post('get_site_detail', { siteName: name }, function (c) {
      if (!c.status) { layer.msg(c.msg || 'error', { icon: 2 }); return; }
      var body = '<div class="wp-modal" id="wp-mod">' +
        '<div class="wp-mod-head">' +
          '<div class="wp-mod-site">' + esc(name) + '</div>' +
          '<div class="wp-mod-meta">Applies within a couple of seconds — no nginx reload.</div>' +
        '</div>' +
        '<div class="wp-mod-body">' +

        modSec('Protection', [
          modRow2('Protection', modSw('m-open', c.open), 'Master switch for this site'),
          modRow2('Scan protection', modSw('m-scan', c.scan), 'Block probes for .env, .git, backups')
        ]) +

        modSec('Request filters', [
          modRow2('GET filter', modSw('m-get', c.get), 'Inspect query strings'),
          modRow2('POST filter', modSw('m-post', c.post), 'Inspect request bodies'),
          modRow2('Cookie filter', modSw('m-cookie', c.cookie), 'Inspect cookies'),
          modRow2('User-Agent filter', modSw('m-ua', c.ua), 'Block scanners by their user-agent')
        ]) +

        modSec('CC defense', [
          modRow2('CC defense', modSw('m-cc', c.cc_open), 'Rate-limit repeated requests from one IP'),
          modRow2('Threshold',
            '<input class="wp-in" id="m-cc-limit" type="number" value="' + (c.cc_limit || 120) + '"> ' +
            '<span class="wp-unit">requests /</span> ' +
            '<input class="wp-in" id="m-cc-cycle" type="number" value="' + (c.cc_cycle || 60) + '"> ' +
            '<span class="wp-unit">seconds</span>', ''),
          modRow2('Block time',
            '<input class="wp-in" id="m-cc-block" type="number" value="' + (c.cc_block || 600) + '"> ' +
            '<span class="wp-unit">seconds</span>', 'How long an offending IP stays blocked'),
          modRow2('Smart CC', modSw('m-smart', c.smart_cc),
            'Tighten each visitor&apos;s allowance automatically while the whole site is under load')
        ]) +

        modSec('Traffic control', [
          modRow2('Crawl protection', modSw('m-crawl', c.crawl),
            'Give unverified bots their own tight budget (verified crawlers unaffected)'),
          modRow2('Crawl limit',
            '<input class="wp-in" id="m-crawl-limit" type="number" value="' + (c.crawl_limit || 30) + '"> ' +
            '<span class="wp-unit">requests / minute</span>', ''),
          modRow2('Waiting room', modSw('m-wait', c.wait),
            'Past the rate below, extra visitors get a retry page instead of a timeout'),
          modRow2('Rate limit',
            '<input class="wp-in" id="m-wait-limit" type="number" value="' + (c.wait_limit || 200) + '"> ' +
            '<span class="wp-unit">requests / second (site-wide)</span>', '')
        ]) +

        modSec('Files', [
          modRow2('Never serve extensions',
            '<input class="wp-in wp-wide" id="m-deny-ext" value="' + esc(c.deny_ext || '') + '" placeholder="sql, bak, ini">',
            'Comma separated, no dots. Direct requests for these files are refused.', true),
          modRow2('Blocked upload extensions',
            '<input class="wp-in wp-wide" id="m-upload-ext" value="' + esc(c.upload_ext || '') + '" placeholder="php, jsp, exe">',
            'Refuse uploads whose filename ends in these — the usual webshell route.', true),
          modRow2('No PHP under paths',
            '<input class="wp-in wp-wide" id="m-php-path" value="' + esc(c.php_path || '') + '" placeholder="/upload/, /static/">',
            'Comma separated path prefixes. A .php request under them is refused, ' +
            'so an uploaded shell cannot execute.', true)
        ]) +

        '</div>' +
        '<div class="wp-mod-foot">' +
          '<span class="wp-btn" id="m-cancel">Cancel</span>' +
          '<span class="wp-btn primary" id="m-save">Save</span>' +
        '</div></div>';
      layer.open({
        type: 1, title: 'Modify site — ' + name, area: ['680px', '640px'], content: body,
        success: function () {
          $('#m-cancel').on('click', function () { layer.closeAll('page'); });
          $('#m-save').on('click', function () {
            var cfg = {
              open: $('#m-open').is(':checked'), scan: $('#m-scan').is(':checked'),
              fake_spider: $('#m-spider').is(':checked'), cdn: $('#m-cdn').is(':checked'),
              get: $('#m-get').is(':checked'), post: $('#m-post').is(':checked'),
              cookie: $('#m-cookie').is(':checked'), ua: $('#m-ua').is(':checked'),
              cc_open: $('#m-cc').is(':checked'),
              cc_limit: parseInt($('#m-cc-limit').val() || 120, 10),
              cc_cycle: parseInt($('#m-cc-cycle').val() || 60, 10),
              cc_block: parseInt($('#m-cc-block').val() || 600, 10),
              smart_cc: $('#m-smart').is(':checked'),
              crawl: $('#m-crawl').is(':checked'),
              crawl_limit: parseInt($('#m-crawl-limit').val() || 30, 10),
              wait: $('#m-wait').is(':checked'),
              wait_limit: parseInt($('#m-wait-limit').val() || 200, 10),
              deny_ext: cleanCsv($('#m-deny-ext').val()),
              upload_ext: cleanCsv($('#m-upload-ext').val()),
              php_path: cleanCsv($('#m-php-path').val())
            };
            post('save_site_detail', { siteName: name, config: JSON.stringify(cfg) }, function (rr) {
              layer.msg(rr.msg, { icon: rr.status ? 1 : 2 });
              if (rr.status) { layer.closeAll('page'); pageWebsite(); }
            });
          });
        }
      });
    });
  }
  // normalise "php, .jsp ,exe" -> "php,jsp,exe"; the engine matches bare, lowercase
  function cleanCsv(v) {
    return (v || '').split(',').map(function (x) {
      return x.trim().replace(/^\./, '').toLowerCase();
    }).filter(Boolean).join(',');
  }
  function modSec(title, rows) {
    return '<div class="wp-mod-sec"><div class="wp-mod-sec-t">' + title + '</div>' +
      rows.join('') + '</div>';
  }
  function modRow2(label, ctrl, hint, wide) {
    return '<div class="wp-mod-row' + (wide ? ' wide' : '') + '">' +
      '<div class="wp-mod-lbl">' + label + '</div>' +
      '<div class="wp-mod-ctl">' + ctrl + '</div>' +
      '<div class="wp-mod-hint">' + (hint || '') + '</div>' +
      '</div>';
  }
  function modSw(id, on) {
    return '<label class="wp-sw"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '><span class="sl"></span></label>';
  }

  /* ================= LOGS ================= */

  /* ================= GLOBAL ================= */
  /* ================= REGION (standalone engine) =================
     One rule per row, each with its own areas, type and status code — our own
     engine backs this, so rows are genuinely independent. */

  // Above this the picker warns: the engine binary-searches the ranges, but the
  // panel still compiles and writes them (the US alone is ~43k ranges).
  var REG_WARN_CIDR = 20000;

  function pageRegion() {
    $('#wp-body').html('<div class="wp-loading">Loading...</div>');
    post('region_rules', {}, function (r) {
      if (!r.status) { $('#wp-body').html('<div class="wp-note">' + esc(r.msg || 'error') + '</div>'); return; }
      post('country_list', {}, function (c) {
        S.regAll = (c && c.status) ? c.data : [];
        S.regMeta = r;
        renderRegion(r);
      });
    });
  }

  function renderRegion(r) {
    var e = r.engine || {};
    var h = '';
    if (!e.wired) {
      h += '<div class="wp-note" style="margin-bottom:12px">' + icoWarn() +
        ' The WAF Pro engine is not wired into nginx yet, so these rules are stored but <b>not enforced</b>.' +
        (e.free_waf_active ? ' The free WAF is currently handling traffic; only one lua engine can be active at a time.' : '') +
        '</div>';
    }
    h += '<div class="wp-card">';
    h += '<div style="margin-bottom:14px"><span class="wp-btn primary" id="rg-add">Add Region Restriction</span></div>';
    h += '<table class="wp-table" style="width:100%;border-collapse:collapse">' +
      '<thead><tr>' +
      ['Area', 'Status', 'Status code', 'Website', 'Type', 'Operate'].map(function (t, i) {
        return '<th style="text-align:' + (i === 5 ? 'right' : 'left') + ';padding:10px 8px;color:var(--wp-text2);' +
          'font-weight:400;border-bottom:1px solid var(--wp-border)">' + t + '</th>';
      }).join('') + '</tr></thead><tbody>';
    if (!r.rules.length) {
      h += '<tr><td colspan="6" style="padding:26px;text-align:center;color:var(--wp-text3)">No region restriction yet.</td></tr>';
    } else {
      h += r.rules.map(function (x) {
        var opts = (r.status_codes || []).map(function (s) {
          return '<option value="' + s.code + '"' + (s.code === x.status ? ' selected' : '') + '>' + esc(s.name) + '</option>';
        }).join('');
        return '<tr data-id="' + x.id + '" style="border-bottom:1px solid var(--wp-border)">' +
          '<td style="padding:9px 8px">' + esc(x.area_text) +
            '<div style="color:var(--wp-text3);font-size:12px">' + num(x.ranges) + ' ranges</div></td>' +
          '<td style="padding:9px 8px"><label class="wp-sw"><input type="checkbox" class="rg-on"' +
            (x.open ? ' checked' : '') + '><span class="sl"></span></label></td>' +
          '<td style="padding:9px 8px"><select class="wp-in rg-code" style="width:210px">' + opts + '</select></td>' +
          '<td style="padding:9px 8px">' + esc(x.site) + '</td>' +
          '<td style="padding:9px 8px">' + (x.type === 'pass' ? 'Pass' : 'Intercept') + '</td>' +
          '<td style="padding:9px 8px;text-align:right"><a href="javascript:;" class="rg-del" style="color:var(--wp-green)">Delete</a></td>' +
          '</tr>';
      }).join('');
    }
    h += '</tbody></table></div>';
    $('#wp-body').html(h);

    $('#rg-add').on('click', regAddDialog);
    $('#wp-body').on('change', '.rg-on', function () {
      var id = $(this).closest('tr').data('id'), on = $(this).is(':checked');
      post('region_rule_toggle', { id: id, open: on ? 1 : 0 }, function (rr) {
        layer.msg(rr.msg, { icon: rr.status ? 1 : 2 });
      });
    });
    $('#wp-body').on('change', '.rg-code', function () {
      var id = $(this).closest('tr').data('id');
      post('region_rule_status', { id: id, status_code: $(this).val() }, function (rr) {
        layer.msg(rr.msg, { icon: rr.status ? 1 : 2 });
      });
    });
    $('#wp-body').on('click', '.rg-del', function () {
      var id = $(this).closest('tr').data('id');
      layer.confirm('Delete this region restriction?', function (i) {
        layer.close(i);
        post('region_rule_del', { id: id }, function (rr) {
          layer.msg(rr.msg, { icon: rr.status ? 1 : 2 });
          if (rr.status) route();
        });
      });
    });
  }

  /* Built on the .wp-modal system (head/body/foot): layer renders the dialog
     outside #wafpro-app, so it needs .wp-modal to pick up the CSS variables,
     and the sticky foot is what keeps Add reachable without scrolling. */
  function regAddDialog() {
    var r = S.regMeta, sel = {}, q = '';

    var sites = (r.sites || []).map(function (s) {
      return '<option value="' + esc(s) + '">' + esc(s) + '</option>';
    }).join('');
    var codes = (r.status_codes || []).map(function (s) {
      return '<option value="' + s.code + '"' + (s.code === 444 ? ' selected' : '') + '>' + esc(s.name) + '</option>';
    }).join('');

    var h = '<div class="wp-modal">' +
      '<div class="wp-mod-head">' +
        '<div class="wp-mod-site">Add Region Restriction</div>' +
        '<div class="wp-mod-meta">Match visitors by country and decide what happens. ' +
          'Loopback and LAN addresses are always allowed.</div>' +
      '</div>' +
      '<div class="wp-mod-body">' +

        '<div class="wp-mod-sec">' +
          '<div class="wp-mod-sec-t">Scope</div>' +
          '<div class="wp-mod-row"><div class="wp-mod-lbl">Website</div>' +
            '<div class="wp-mod-ctl"><select class="wp-in" id="ra-site" style="min-width:250px">' + sites + '</select></div>' +
            '<div class="wp-mod-hint">The rule applies to this site only.</div></div>' +
          '<div class="wp-mod-row"><div class="wp-mod-lbl">Response</div>' +
            '<div class="wp-mod-ctl"><select class="wp-in" id="ra-code" style="min-width:250px">' + codes + '</select></div>' +
            '<div class="wp-mod-hint">What blocked visitors receive.</div></div>' +
        '</div>' +

        '<div class="wp-mod-sec">' +
          '<div class="wp-mod-sec-t">Type</div>' +
          '<div class="wp-seg">' +
            '<label id="ra-t-i" class="on"><input type="radio" name="ra-type" value="intercept" checked>' +
              '<span class="t"><span class="dot"></span>Intercept</span>' +
              '<div class="d">Block the selected areas. Everyone else gets through.</div></label>' +
            '<label id="ra-t-p"><input type="radio" name="ra-type" value="pass">' +
              '<span class="t"><span class="dot"></span>Pass</span>' +
              '<div class="d">Allow only the selected areas. Everyone else is blocked.</div></label>' +
          '</div>' +
        '</div>' +

        '<div class="wp-mod-sec">' +
          '<div class="wp-mod-sec-t">Area</div>' +
          '<div class="wp-pick">' +
            '<div class="wp-pick-bar">' +
              '<input class="wp-in" id="ra-q" placeholder="Search country or ISO code">' +
              '<span class="wp-link" id="ra-all">Select all</span>' +
              '<span class="wp-link" id="ra-none">Clear</span>' +
            '</div>' +
            '<div class="wp-pick-list" id="ra-list"></div>' +
            '<div class="wp-chips" id="ra-chips"></div>' +
          '</div>' +
        '</div>' +

      '</div>' +
      '<div class="wp-mod-foot">' +
        '<div id="ra-cost" class="wp-cost" style="margin-right:auto;align-self:center"></div>' +
        '<span class="wp-btn" id="ra-cancel">Cancel</span>' +
        '<span class="wp-btn primary" id="ra-ok">Add rule</span>' +
      '</div>' +
      '</div>';

    var idx = layer.open({
      type: 1, title: false, closeBtn: 1, shadeClose: true,
      area: ['720px', '620px'], content: h
    });

    function shown() {
      return S.regAll.filter(function (x) {
        return !q || x.name.toLowerCase().indexOf(q) >= 0 || x.code.toLowerCase().indexOf(q) >= 0;
      });
    }
    function drawList() {
      var rows = shown();
      $('#ra-list').html(rows.length ? rows.map(function (x) {
        return '<label class="wp-ctry' + (sel[x.code] ? ' on' : '') + '" data-c="' + x.code + '">' +
          '<input type="checkbox" class="ra-c" data-c="' + x.code + '"' + (sel[x.code] ? ' checked' : '') + '>' +
          '<span class="n">' + esc(x.name) + ' <span class="c">(' + x.code + ')</span></span>' +
          '<span class="k">' + num(x.cidr) + '</span></label>';
      }).join('') : '<div style="padding:26px;text-align:center;color:var(--wp-text3)">No match for "' + esc(q) + '"</div>');
    }
    function drawChips() {
      var keys = Object.keys(sel);
      if (!keys.length) {
        $('#ra-chips').html('<span style="color:var(--wp-text3);font-size:12px">No area selected yet</span>');
      } else {
        var by = {};
        S.regAll.forEach(function (x) { by[x.code] = x; });
        $('#ra-chips').html(keys.map(function (c) {
          return '<span class="wp-chip2"><b>' + esc((by[c] && by[c].name) || c) + '</b>' +
            '<i class="ra-x" data-c="' + c + '">&times;</i></span>';
        }).join(''));
      }
      var cidr = S.regAll.reduce(function (a, x) { return a + (sel[x.code] ? x.cidr : 0); }, 0);
      var warn = cidr > REG_WARN_CIDR;
      // The engine binary-searches these ranges, but the panel still has to
      // compile and ship them — worth showing before someone picks the US.
      $('#ra-cost').attr('class', 'wp-cost' + (warn ? ' warn' : ''))
        .html(keys.length ? ('<b>' + keys.length + '</b> selected · <b>' + num(cidr) + '</b> CIDR' +
          (warn ? ' — large list, compiles slower' : '')) : '');
    }
    function draw() { drawList(); drawChips(); }
    draw();

    $('#ra-q').on('input', function () { q = ($(this).val() || '').toLowerCase(); drawList(); });
    $('#ra-list').on('change', '.ra-c', function () {
      var c = $(this).data('c');
      if (this.checked) sel[c] = 1; else delete sel[c];
      $(this).closest('.wp-ctry').toggleClass('on', this.checked);
      drawChips();
    });
    $('#ra-chips').on('click', '.ra-x', function () {
      delete sel[$(this).data('c')];
      draw();
    });
    $('#ra-all').on('click', function () {
      shown().forEach(function (x) { sel[x.code] = 1; });   // only what the filter shows
      draw();
    });
    $('#ra-none').on('click', function () { sel = {}; draw(); });
    $('.wp-seg input').on('change', function () {
      $('.wp-seg label').removeClass('on');
      $(this).closest('label').addClass('on');
    });
    $('#ra-cancel').on('click', function () { layer.close(idx); });
    $('#ra-ok').on('click', function () {
      var areas = Object.keys(sel);
      if (!areas.length) return layer.msg('Select at least one area', { icon: 2 });
      var $b = $(this);
      if ($b.data('busy')) return;
      $b.data('busy', 1).text('Adding...');
      post('region_rule_add', {
        areas: JSON.stringify(areas), site: $('#ra-site').val(),
        type: $('.wp-seg input:checked').val(), status_code: $('#ra-code').val()
      }, function (rr) {
        layer.msg(rr.msg, { icon: rr.status ? 1 : 2 });
        if (rr.status) { layer.close(idx); route(); }
        else $b.data('busy', 0).text('Add rule');
      });
    });
  }
  /* Global = engine-wide settings only. The per-filter switches (GET/POST/
     cookie/UA/scan/CC) are per site and live on the WebSite tab. */
  var STATUS_OPTS = [
    { code: 444, name: '444 Close connection' },
    { code: 403, name: '403 Access denied' },
    { code: 404, name: '404 File not exist' },
    { code: 503, name: '503 Server unavailable' },
    { code: 405, name: '405 Method not allowed' }
  ];
  function statusSel(id, val) {
    return '<select class="wp-in" id="' + id + '" style="width:200px">' + STATUS_OPTS.map(function (s) {
      return '<option value="' + s.code + '"' + (s.code === val ? ' selected' : '') + '>' + s.name + '</option>';
    }).join('') + '</select>';
  }

  /* ================= TRAFFIC LIMIT =================
     Per-URL rate limiting, lowest priority. One rule per row, same table
     language as Region. Built for API endpoints, not whole sites. */
  var TL_STATUS = [
    { code: 503, name: '503 (Service Unavailable)' },
    { code: 502, name: '502 (Connection Timeout)' },
    { code: 444, name: '444 (Close connection)' },
    { code: 403, name: '403 (Access denied)' }
  ];
  function tlTrigger(t) {
    var who = t.dim === 'ipua' ? 'Single IP + UA' : 'Single IP';
    return 'At <b>' + who + '</b> accessing <b>' + esc(t.url) + '</b> more than <b>' +
      t.rate + '</b> times per second, traffic restriction is triggered';
  }
  function tlAction(t) {
    if (t.action === 'block') return 'Intercept (Block IP)';
    var n = { 503: 'Service Unavailable', 502: 'Connection Timeout',
              444: 'Close connection', 403: 'Access denied' }[t.status] || '';
    return 'Status Code ' + t.status + (n ? ' (' + n + ')' : '');
  }

  function pageTraffic() {
    $('#wp-body').html('<div class="wp-loading">Loading...</div>');

  function renderTraffic(r) {
    var e = r.engine || {};
    var h = '';
    if (!e.wired) {
      h += '<div class="wp-note" style="margin-bottom:12px">' + icoWarn() +
        ' The engine is not wired into nginx, so these rules are stored but not enforced.</div>';

    h += '<div class="wp-card">';
    h += '<div style="margin-bottom:14px"><span class="wp-btn primary" id="tl-add">Add Restriction</span></div>';
    h += '<table class="wp-tbl"><thead><tr>' +
      '<th style="width:130px">Rule Name</th>' +
      '<th style="width:170px">Website Name</th>' +
      '<th>Trigger Condition</th>' +
      '<th style="width:230px">Execute Action</th>' +
      '<th style="width:60px">Status</th>' +
      '<th style="width:100px">Operate</th></tr></thead><tbody>';
    if (!r.rules.length) {
      h += '<tr><td colspan="6" style="padding:26px;text-align:center;color:var(--wp-text3)">No traffic restriction yet.</td></tr>';
    } else {
      h += r.rules.map(function (t) {
        return '<tr data-id="' + t.id + '">' +
          '<td style="color:var(--wp-text);font-weight:600">' + esc(t.name) + '</td>' +
          '<td class="ell" title="' + esc(t.site) + '">' + esc(t.site) + '</td>' +
          '<td style="color:var(--wp-text2)">' + tlTrigger(t) + '</td>' +
          '<td>' + tlAction(t) + '</td>' +
          '<td><label class="wp-sw"><input type="checkbox" class="tl-on"' + (t.open ? ' checked' : '') +
          '><span class="sl"></span></label></td>' +
          '<td><a href="javascript:;" class="tl-edit" style="color:var(--wp-green)">Edit</a> ' +
          '<span style="color:var(--wp-border)">|</span> ' +
          '<a href="javascript:;" class="tl-del" style="color:var(--wp-green)">Delete</a></td></tr>';
      }).join('');
    }
    h += '</tbody></table>';
    h += '<ul class="wp-notes">' +
      '<li>The priority of traffic restrictions is the lowest.</li>' +
      '<li>Traffic restrictions are generally used for API endpoints; enabling them for a whole site is not recommended.</li>' +
      '<li>The suggested return type is 503 or 502.</li>' +
      '<li>Loopback and LAN addresses are never rate-limited.</li>' +
      '</ul>';
    h += '</div>';
    $('#wp-body').html(h);

    $('#tl-add').on('click', function () { tlDialog(null); });
    $('#wp-body').on('click', '.tl-edit', function () {
      var id = $(this).closest('tr').data('id');
      tlDialog(r.rules.filter(function (x) { return x.id === id; })[0]);
    });
    $('#wp-body').on('change', '.tl-on', function () {
      var id = $(this).closest('tr').data('id'), on = $(this).is(':checked');
      post('traffic_toggle', { id: id, open: on ? 1 : 0 }, function (rr) {
        layer.msg(rr.msg, { icon: rr.status ? 1 : 2 });
      });
    });
    $('#wp-body').on('click', '.tl-del', function () {
      var id = $(this).closest('tr').data('id');
      layer.confirm('Delete this traffic restriction?', function (i) {
        layer.close(i);
        post('traffic_del', { id: id }, function (rr) {
          layer.msg(rr.msg, { icon: rr.status ? 1 : 2 });
          if (rr.status) route();
        });
      });
    });

    var idx = layer.open({ type: 1, title: false, closeBtn: 1, area: ['680px', '620px'], content: h });

  function pageGlobal() {
    $('#wp-body').html('<div class="wp-loading">Loading...</div>');

      if (!c.status) { $('#wp-body').html('<div class="wp-note">' + esc(c.msg || 'error') + '</div>'); return; }
      post('get_methods', {}, function (m) {
        post('get_hdr_limits', {}, function (hl) {
          post('spider_status', {}, function (sp) {
            post('malicious_status', {}, function (ml) {

  // one grouped card: shown only when its sub-tab (or All) is active
  function gcard(group, ico, title, inner) {
    return '<div class="wp-gc" data-g="' + group + '">' +
      '<div class="wp-card" style="max-width:820px;margin-top:14px"><div class="wp-card-h">' +
      ico + '<span class="t">' + title + '</span></div>' + inner + '</div></div>';
  }

  // section header + feature cards, so each setting reads as its own row
  function gsec(group, text) {
    return '<div class="wp-gc" data-g="' + group + '"><div class="wp-gsec">' + text + '</div></div>';
  }
  function fcard(group, title, desc, controls, body, hero) {
    var head = '<div style="display:flex;align-items:center;gap:20px">' +
      '<div class="wp-fc-l"><div class="wp-fc-t">' + title + '</div>' +
      (desc ? '<div class="wp-fc-d">' + desc + '</div>' : '') + '</div>' +
      '<div class="wp-fc-r">' + (controls || '') + '</div></div>';
    return '<div class="wp-gc" data-g="' + group + '">' +
      '<div class="wp-fc' + (hero ? ' hero' : '') + (body ? ' wp-fc-col' : '') + '">' +
      head + (body ? '<div class="wp-fc-body">' + body + '</div>' : '') + '</div></div>';
  }

  function renderGlobal(c, m, hl, sp, ml, senList) {
    var e = c.engine || {};
    S.gSub = S.gSub || 'all';
    var SUBS = [['all', 'All'], ['cc', 'CC defense'], ['access', 'Access filter'],
                ['vuln', 'Website vulnerability defense'], ['sensitive', 'Sensitive words']];

    var h = '<div class="wp-subtabs" id="g-subs">' + SUBS.map(function (x) {
      return '<span class="wp-subtab' + (x[0] === S.gSub ? ' on' : '') + '" data-g="' + x[0] + '">' + x[1] + '</span>';
    }).join('') + '</div>';
    h += '<div id="g-cards" style="max-width:1080px">';

    if (!e.wired) {
      h += '<div class="wp-gc" data-g="all"><div class="wp-note" style="margin-top:12px">' + icoWarn() +

      '<span class="wp-btn" id="g-import">Import</span>' +
      '<span class="wp-btn" id="g-restore">Restore defaults</span>', '', true);
    h += fcard('all', 'Engine wired into nginx',
      'Installs our lua into nginx. Tested before apply, rolled back on failure.',

    /* ===== CC defense ===== */

        '<span>Ban after <input class="wp-in" id="g-retry" type="number" style="width:70px" value="' + (c.retry || 0) +
        '"> trips within <input class="wp-in" id="g-retry-cycle" type="number" style="width:70px" value="' + (c.retry_cycle || 60) + '"> s</span>' +
        '<span>Ban duration <input class="wp-in" id="g-retry-time" type="number" style="width:80px" value="' + (c.retry_time || 600) + '"> s</span>' +
      '</div>');
    h += fcard('cc', 'Static file protection',

    var mhave = ml && ml.have;
    h += fcard('cc', 'Malicious IP feed',
      'Public abuse feeds (botnets, repeat attackers). When on, blocked on every site. ' +

      'Backs the Fake spider switch on each site. ' +
      (have ? '<b>' + num(sp.count) + '</b> ranges from ' + esc((sp.sources || []).join(', ')) + ', updated ' + esc(sp.updated)
            : '<span style="color:var(--wp-red)">not downloaded — Fake spider does nothing</span>'),
      '<span class="wp-btn" id="g-spider">' + (have ? 'Synchronize' : 'Download') + '</span>');

    /* ===== Access filter ===== */
    h += gsec('access', 'Access filter');
    h += fcard('access', 'Logging', 'Write blocks to /www/wwwlogs/wafpro/.',

      sw('g-log', c.log) + '<span class="wp-btn" id="g-save-log">Save</span>');
    h += fcard('access', 'Behind CDN',
      'Read the visitor IP from X-Forwarded-For. Only if a proxy really sits in front — otherwise IPs can be spoofed.',

        return '<label style="display:flex;align-items:center;gap:6px;cursor:pointer">' +
          '<input type="checkbox" class="g-m" value="' + x + '"' + (onM[x] ? ' checked' : '') +
          (x === 'GET' ? ' disabled' : '') + '>' + x + '</label>';
      }).join('') + '</div>');
    var lims = (hl && hl.data) || [];
    h += fcard('access', 'Header size limits', 'Requests with a header longer than this are refused.',
      '<span class="wp-btn primary" id="g-save-h">Save</span>',
      '<div style="display:flex;flex-wrap:wrap;gap:20px">' + lims.map(function (x) {
        return '<label style="display:flex;align-items:center;gap:8px">' + esc(x.h) +
          '<input class="wp-in g-h" data-h="' + esc(x.h) + '" type="number" style="width:90px" value="' + x.max + '"> B</label>';
      }).join('') + '</div>');

    /* ===== Website vulnerability defense ===== */
    h += gsec('vuln', 'Website vulnerability defense');
    var rcRow = function (id, label, val) {
      return '<label style="display:flex;align-items:center;gap:8px">' +
        '<span style="width:130px;color:var(--wp-text2)">' + label + '</span>' + statusSel(id, val) + '</label>';
    };
    h += fcard('vuln', 'Response codes', 'What blocked visitors receive, per protection type.',

      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 30px">' +
        rcRow('g-s-get', 'SQL/XSS query', c.get_status) + rcRow('g-s-post', 'SQL/XSS body', c.post_status) +
        rcRow('g-s-cookie', 'Cookie', c.cookie_status) + rcRow('g-s-ua', 'User-Agent', c.ua_status) +
        rcRow('g-s-scan', 'Scanner paths', c.scan_status) + rcRow('g-s-cc', 'CC defense', c.cc_status) +
        rcRow('g-s-black', 'Blacklist / ban', c.black_status) + rcRow('g-s-method', 'Bad method', c.method_status) +

      '</div>');

    h += gsec('sensitive', 'Sensitive words');

        '<input class="wp-in" id="g-sen-in" placeholder="word or regex, e.g. (?i)union\\s+select" style="flex:1">' +
        '<span class="wp-btn primary" id="g-sen-add">Add</span></div>' +
      '<table class="wp-tbl"><thead><tr><th>Word / pattern</th><th style="width:80px">Operate</th></tr></thead><tbody>' +
      (words.length ? words.map(function (x) {
        return '<tr><td style="font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all">' + esc(x.value) + '</td>' +
          '<td><a href="javascript:;" class="g-sen-del" data-i="' + x.index + '" style="color:var(--wp-green)">Delete</a></td></tr>';

      '</tbody></table>');

    $('#g-subs .wp-subtab').on('click', function () {

    /* ---- handlers ---- */

    $('#g-spider').on('click', function () { var $b = $(this).text('...'); post('spider_update', {}, function (rr) { layer.msg(rr.msg, { icon: rr.status ? 1 : 2 }); if (rr.status) route(); else $b.text('Synchronize'); }); });

    function senAdd() {

    });

    $('#g-export').on('click', function () {
      post('export_config', {}, function (rr) {

        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = rr.filename || 'wafpro-config.json';

    $('#g-import').on('click', function () {

    $('#g-restore').on('click', function () {
      layer.confirm('Restore every WAF Pro setting to defaults? This cannot be undone.', { icon: 3, title: 'Restore defaults' }, function (i) {
        layer.close(i);
        post('restore_config', {}, function (rr) { layer.msg(rr.msg, { icon: rr.status ? 1 : 2 }); if (rr.status) route(); });
      });
    });
  }

  function applyGSub() {
    $('#g-cards .wp-gc').each(function () {
      $(this).css('display', (S.gSub === 'all' || $(this).data('g') === S.gSub) ? '' : 'none');
    });
  }

  function row(label, ctrl, tip) {
    return '<div style="display:flex;align-items:center;gap:14px;padding:11px 0">' +
      '<div style="width:150px;color:var(--wp-text2);text-align:right;flex:none">' + label + '</div>' +
      '<div style="flex:none">' + ctrl + '</div>' +
      (tip ? '<div style="color:var(--wp-text3);font-size:12px">' + tip + '</div>' : '') + '</div>';
  }
  function sw(id, on) {
    return '<label class="wp-sw"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '><span class="sl"></span></label>';
  }

  /* ---------- inline icons ---------- */
  function icoFilter() { return '<svg class="wp-ico" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>'; }
  function icoPulse() { return '<svg class="wp-ico" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>'; }
  function icoShield() { return '<svg class="wp-ico" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>'; }
  function icoWarn() { return '<svg class="wp-ico" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>'; }
  function icoChart() { return '<svg class="wp-ico" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'; }
  function icoDoc() { return '<svg class="wp-ico" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>'; }
  function icoPie() { return '<svg class="wp-ico" viewBox="0 0 24 24"><path d="M12 3v9h9"/><circle cx="12" cy="12" r="9"/></svg>'; }
  function icoClock() { return '<svg class="wp-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'; }
  function icoGlobe() { return '<svg class="wp-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>'; }
  function svgBugBg() {
    return '<svg class="bg" viewBox="0 0 24 24"><path d="M9 8V6a3 3 0 016 0v2"/><rect x="7" y="8" width="10" height="11" rx="5"/><path d="M3 13h4M17 13h4M4 19l3.5-2M20 19l-3.5-2"/></svg>';
  }
  function svgShieldBg() {
    return '<svg class="bg" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v5M12 16h.01"/></svg>';
  }

  /* ---------- boot ---------- */
  window.addEventListener('resize', widen);
  setTimeout(widen, 60); setTimeout(widen, 300); setTimeout(widen, 900);
  renderTabs();
  route();
})();
</script>
