<div id="wafpro-app">
  <div class="wp-tabs" id="wp-tabs"></div>
    <div class="wp-body" id="wp-body"><div class="wp-loading">Loading...</div></div>
</div>
<script type="text/javascript">
/* WAF Pro loader: stylesheet + modules from /wafpro/static/, in order.
   Modules: static/js/core.js (helpers, router), pages/*.js (one per tab),
   shared.js, app.js (boot). ?v= busts the browser cache on upgrade. */
(function () {
  var V = '2.2', BASE = '/wafpro/static/';
  var FILES = ["js/core.js", "js/pages/blockade.js", "js/pages/lists.js", "js/pages/rules.js", "js/pages/exclusive.js", "js/pages/overview.js", "js/pages/website.js", "js/pages/region.js", "js/pages/traffic.js", "js/pages/attackmap.js", "js/pages/report.js", "js/pages/global.js", "js/pages/webshell.js", "js/shared.js", "js/app.js"];
  // one stylesheet per page; swap its href when the plugin was upgraded
  var l = document.getElementById('wafpro-css');
  if (!l) {
    l = document.createElement('link');
    l.id = 'wafpro-css'; l.rel = 'stylesheet';
    document.head.appendChild(l);
  }
  if (l.getAttribute('href') !== BASE + 'css/wafpro.css?v=' + V) l.href = BASE + 'css/wafpro.css?v=' + V;
  (function next(i) {
    if (i >= FILES.length) return;
    var s = document.createElement('script');
    s.src = BASE + FILES[i] + '?v=' + V;
    s.onload = function () { next(i + 1); };
    s.onerror = function () {
      var b = document.getElementById('wp-body');
      if (b) b.innerHTML = '<div class="wp-note">Could not load ' + FILES[i] + ' — reinstall the plugin.</div>';
    };
    document.body.appendChild(s);
  })(0);
})();
</script>
