# WAF Pro engine. NOTE: no lua_package_path here on purpose — the panel
# already declares one in nginx.conf's http block and a second would be a
# duplicate directive, which stops nginx from starting. init.lua extends
# package.path from inside lua instead (once, at startup).
#
# The engine is loaded ONCE in init.lua and cached in a VM global; every phase
# just calls that cached function — no per-request dofile/disk I/O.
lua_shared_dict wafpro_cc 20m;
lua_shared_dict wafpro_block 10m;
init_by_lua_file          /www/server/wafpro/init.lua;
init_worker_by_lua_file   /www/server/wafpro/worker.lua;
access_by_lua_file        /www/server/wafpro/waf.lua;
header_filter_by_lua_file /www/server/wafpro/header.lua;
body_filter_by_lua_file   /www/server/wafpro/body.lua;
